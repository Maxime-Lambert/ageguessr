# Profil "ingest" : commande ponctuelle d'ingestion des personnes (IngestPeopleRunner).
# server.port=-1 : contexte web complet (la configuration de securite se charge comme en
# production) mais aucun serveur HTTP demarre, donc rien n'ecoute pendant l'ingestion.
# web-application-type=none ne convient pas : SecurityConfig a besoin du bean HttpSecurity,
# qui n'existe que dans un contexte web.
server.port=-1
# Une commande ponctuelle ne tire jamais la partie du jour : c'est le role de l'API.
app.game.daily.draw-enabled=false
app.game.guest.purge-enabled=false
