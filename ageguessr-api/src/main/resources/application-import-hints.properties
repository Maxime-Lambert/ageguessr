# Profil "import-hints" : commande ponctuelle d'import des indices (ImportHintsRunner).
# server.port=-1 : meme raison que application-ingest.properties, le contexte web complet
# se charge mais aucun serveur HTTP ne demarre.
server.port=-1
# Une commande ponctuelle ne tire jamais la partie du jour : c'est le role de l'API.
app.game.daily.draw-enabled=false
app.game.guest.purge-enabled=false
app.game.series.purge-enabled=false
# true : les indices dont la cle n'est plus dans les fichiers sont retires (V22), pour une
# extraction qui remplace la precedente (feature/hint-notoriety). false par defaut : un
# import ordinaire n'ajoute que le nouveau.
app.hints.import.retire-absent=${HINTS_RETIRE_ABSENT:false}
