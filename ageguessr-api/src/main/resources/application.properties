spring.application.name=AgeguessrApi

# Base de donnees (docker-compose.yml en local, variables d'environnement en prod)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ageguessr}
spring.datasource.username=${DB_USER:ageguessr}
spring.datasource.password=${DB_PASSWORD:ageguessr}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis (docker-compose.yml en local, variables d'environnement en prod)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# JWT (HS256 symetrique, emis et valide en interne - voir JwtConfig)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:ageguessr-api}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:60}

# Cookie du refresh token
app.refresh-token.cookie-name=${REFRESH_TOKEN_COOKIE_NAME:ageguessr_refresh_token}
app.refresh-token.ttl-days=${REFRESH_TOKEN_TTL_DAYS:90}
app.cookie.secure=${COOKIE_SECURE:false}

# CORS (defense en profondeur - le proxy dev Angular est le chemin principal en local)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Utilise pour construire le lien de verification d'email
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Resend (email transactionnel)
app.email.resend-api-key=${RESEND_API_KEY}
app.email.from=${EMAIL_FROM:Ageguessr <no-reply@ageguessr.app>}
app.email.verification-token-ttl-hours=${EMAIL_VERIFICATION_TOKEN_TTL_HOURS:24}

# Rate limiting sur /api/auth/*, partitionne par IP client
app.rate-limit.auth.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
app.rate-limit.auth.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:1}
# Et sur les essais du jeu (POST /api/game/*) : une partie complete en fait 9. 60 par minute
# laisse jouer plusieurs personnes derriere une meme IP (box, NAT) sans laisser un script
# creer des milliers de parties invitees.
app.rate-limit.game.max-attempts=${GAME_RATE_LIMIT_MAX_ATTEMPTS:60}
app.rate-limit.game.window-minutes=${GAME_RATE_LIMIT_WINDOW_MINUTES:1}
# Creation de series et inscription a un defi : plus serre, car chaque serie revele l'age de
# ses photos. 30 par heure laisse enchainer les series sans laisser un script moissonner le pool.
app.rate-limit.series.max-attempts=${SERIES_RATE_LIMIT_MAX_ATTEMPTS:30}
app.rate-limit.series.window-minutes=${SERIES_RATE_LIMIT_WINDOW_MINUTES:60}
# Signalements d'une manche : un par manche jouee au plus, 20 par heure suffit largement a un
# joueur et borne un script qui voudrait remplir la file de l'admin.
app.rate-limit.report.max-attempts=${REPORT_RATE_LIMIT_MAX_ATTEMPTS:20}
app.rate-limit.report.window-minutes=${REPORT_RATE_LIMIT_WINDOW_MINUTES:60}

# Lockout de compte apres echecs de connexion repetes
app.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# Liens envoyes par email pour les actions sensibles sur le compte (account_tokens)
app.account-token.password-reset-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}
app.account-token.secure-account-ttl-hours=${SECURE_ACCOUNT_TTL_HOURS:24}
app.account-token.deletion-ttl-minutes=${ACCOUNT_DELETION_TTL_MINUTES:60}

# Clients Wikimedia (ingestion des personnes uniquement, jamais pendant une partie).
# User-Agent exige par la politique Wikimedia : nom du service + moyen de contact.
app.wikimedia.user-agent=${WIKIMEDIA_USER_AGENT:Ageguessr/1.0 (https://ageguessr.app; contact@ageguessr.app)}
app.wikimedia.qlever-url=${QLEVER_URL:https://qlever.dev/api/wikidata}
app.wikimedia.commons-api-url=${COMMONS_API_URL:https://commons.wikimedia.org/w/api.php}
app.wikimedia.request-pause-ms=${WIKIMEDIA_REQUEST_PAUSE_MS:200}
app.wikimedia.max-attempts=${WIKIMEDIA_MAX_ATTEMPTS:6}
app.wikimedia.connect-timeout-seconds=${WIKIMEDIA_CONNECT_TIMEOUT_SECONDS:10}
app.wikimedia.read-timeout-seconds=${WIKIMEDIA_READ_TIMEOUT_SECONDS:120}

# Ingestion des personnes (profil "ingest", voir plans/done/people-sourcing.md)
app.people.ingest.target-photos=${INGEST_TARGET_PHOTOS:5000}
app.people.ingest.page-size=${INGEST_PAGE_SIZE:500}
app.people.ingest.max-photos-per-person=${INGEST_MAX_PHOTOS_PER_PERSON:5}
app.people.ingest.min-years-between-photos=${INGEST_MIN_YEARS_BETWEEN_PHOTOS:10}
app.people.ingest.depicts-search-limit=${INGEST_DEPICTS_SEARCH_LIMIT:50}
app.people.ingest.thumbnail-height=${INGEST_THUMBNAIL_HEIGHT:1000}
app.people.ingest.min-image-height=${INGEST_MIN_IMAGE_HEIGHT:600}
app.people.ingest.max-image-bytes=${INGEST_MAX_IMAGE_BYTES:5000000}
app.people.ingest.min-birth-year=${INGEST_MIN_BIRTH_YEAR:1930}
app.people.ingest.expected-approval-rate=${INGEST_EXPECTED_APPROVAL_RATE:0.4}


# Partie du jour (plans/done/daily-draw.md) : nombre de photos par jour, delai avant de rejouer
# une photo, et tirage automatique a minuit UTC et au demarrage.
# Le tirage tourne par defaut depuis que le jeu est jouable (plans/done/daily-guess.md) ; il reste
# coupe dans les tests et les commandes ponctuelles (ingestion, import des indices).
app.game.daily.rounds=${GAME_DAILY_ROUNDS:3}
app.game.daily.replay-years=${GAME_DAILY_REPLAY_YEARS:3}
app.game.daily.draw-enabled=${GAME_DAILY_DRAW_ENABLED:true}

# Jeu sans compte : duree du cookie ageguessr_guest, et conservation des parties invitees
# (purge quotidienne). A garder en accord avec /privacy.
app.game.guest.cookie-ttl-days=${GAME_GUEST_COOKIE_TTL_DAYS:30}
app.game.guest.retention-days=${GAME_GUEST_RETENTION_DAYS:7}
app.game.guest.purge-enabled=${GAME_GUEST_PURGE_ENABLED:true}

# Enquete libre et Defi : une serie jamais partagee est supprimee 7 jours apres sa creation, un
# defi (classement et pseudos d'invites compris) 30 jours apres son partage. A garder en accord
# avec /privacy.
app.game.series.retention-days=${GAME_SERIES_RETENTION_DAYS:7}
app.game.series.challenge-retention-days=${GAME_SERIES_CHALLENGE_RETENTION_DAYS:30}
app.game.series.purge-enabled=${GAME_SERIES_PURGE_ENABLED:true}

# Signalements des joueurs : l'admin recoit un email quand une photo ou un indice atteint ce
# nombre de signalements ouverts (des le premier pour une photo de la partie du jour, ou qui
# parait mineure). Sans ADMIN_EMAIL, un log WARN a la place.
app.admin.email=${ADMIN_EMAIL:}
app.reports.alert-threshold=${REPORTS_ALERT_THRESHOLD:3}
