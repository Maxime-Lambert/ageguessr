# Full copy of src/main/resources/application.properties: a same-named file in test
# resources REPLACES the main one on the test classpath entirely (it does not merge
# key-by-key) — so every key from main must be repeated here, with only the two
# no-default secrets swapped for test-safe literal values. Never used to send real
# email or issue tokens outside tests.
spring.application.name=AgeguessrApi

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=S2wyEBMLjFQPUYj29TUDvZRxH/RY1dCCSRpgKJ21dg4=
app.jwt.issuer=ageguessr-api
app.jwt.access-token-ttl-minutes=60

app.refresh-token.cookie-name=ageguessr_refresh_token
app.refresh-token.ttl-days=90
app.cookie.secure=false

app.cors.allowed-origin=http://localhost:4200

app.frontend-url=http://localhost:4200

app.email.resend-api-key=test-not-a-real-key
app.email.from=Ageguessr <no-reply@ageguessr.app>
app.email.verification-token-ttl-hours=24

# Generous by default so functional tests exercising real login/register flows never
# trip this incidentally (MockMvc requests all share one simulated client IP, so every
# functional test in the same cached Spring context shares one counter). The dedicated
# rate-limiting behavior test overrides this to a small value via @TestPropertySource,
# which gets its own distinct (uncached) context and counter.
app.rate-limit.auth.max-attempts=1000
app.rate-limit.auth.window-minutes=1

app.lockout.max-attempts=5
app.lockout.duration-minutes=15
