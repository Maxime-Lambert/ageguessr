name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ageguessr-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Test (unitaire + intégration + fonctionnel + architecture)
        run: ./mvnw test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Unitaire (Vitest)
        run: pnpm test

      - name: Installer Playwright + navigateurs
        run: pnpm exec playwright install --with-deps chromium

      - name: Interface (Playwright)
        run: pnpm test:e2e

  # Les images sont buildees ici (runner GitHub, 16 Go de RAM) et non sur le VPS :
  # ng build monte a ~4 Go a cause de @lucide/angular (toutes les icones dans un seul
  # fichier de 12 Mo a passer au linker Angular), ce qui faisait tuer le build sur un
  # VPS partage avec un autre projet en prod.
  publish-images:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ageguessr-api
            dockerfile: ageguessr-api/Dockerfile
          - image: ageguessr-edge
            dockerfile: Dockerfile.edge
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/maxime-lambert/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: [publish-images]
    environment: production
    # Deux merges rapproches sur main : le second deploiement attend la fin du premier
    # au lieu de modifier .env et les conteneurs en meme temps.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Lecture seule : ce jeton est transmis au VPS pour le docker pull, il ne doit pas
    # pouvoir pousser d'image. Il expire de toute facon a la fin du job.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Les actions tierces qui recoivent la cle SSH et les secrets de prod sont epinglees
      # par SHA de commit : un tag peut etre reecrit si le depot de l'action est compromis.
      # Seul le compose est necessaire sur le VPS : le code est dans les images.
      - name: Copier le compose de prod sur le VPS
        uses: easingthemes/ssh-deploy@922253577e23ce0edbfdbf819f0e1ceaecabc61a # v5.1.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "docker-compose.prod.yml"
          TARGET: /opt/ageguessr/
          ARGS: "-az"
          REMOTE_PORT: 2222

      - name: Écrire le .env de prod et déployer
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DOMAIN: ${{ vars.DOMAIN }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          envs: POSTGRES_PASSWORD,JWT_SECRET,RESEND_API_KEY,DOMAIN,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/ageguessr
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            # Pull AVANT de reecrire .env : si le pull echoue, .env garde l'IMAGE_TAG du
            # dernier deploiement reussi (un "up -d" manuel relance alors cette version).
            # IMAGE_TAG est exporte par ssh-action, et l'environnement du shell est
            # prioritaire sur .env pour Compose.
            docker compose -f docker-compose.prod.yml pull
            cat > .env <<ENVEOF
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            RESEND_API_KEY=$RESEND_API_KEY
            DOMAIN=$DOMAIN
            IMAGE_TAG=$IMAGE_TAG
            ENVEOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml up -d
            # Uniquement nos images (taguees par SHA, donc jamais "dangling") : un prune
            # global toucherait aussi celles de l'autre projet du VPS.
            docker images --filter 'reference=ghcr.io/maxime-lambert/ageguessr-*' \
              --format '{{.Repository}}:{{.Tag}}' | grep -v ":$IMAGE_TAG\$" \
              | xargs -r docker rmi || true

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://${{ vars.DOMAIN }}/api/health"; then
              echo "Déploiement OK"
              exit 0
            fi
            echo "Tentative $i/10 échouée, retry dans 5s..."
            sleep 5
          done
          echo "Smoke test échoué après 10 tentatives"
          exit 1
