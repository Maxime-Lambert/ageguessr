name: Mutation testing

on:
  pull_request:
    branches: [main]

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      # Pas de continue-on-error : sans seuil (mutationThreshold) configure, PIT n'echoue
      # que s'il ne peut pas tourner, jamais a cause du score. continue-on-error
      # masquait un PIT qui ne mutait rien (Java 25 non supporte, plugin JUnit 5
      # absent, classes non compilees) : le step affichait "success" en ~30 s.
      - name: Run PIT
        run: ./scripts/run-mutation-tests.sh

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: ageguessr-api/target/pit-reports/**
