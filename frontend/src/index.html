<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ageguessr</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- favicon.ico for browsers without SVG favicons; generated from Fraunces, see
         public/README.md -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Applique le theme stocke avant le rendu Angular pour eviter un flash
      // (voir docs/decisions/design.md : sombre par defaut, classe .light en override).
      try {
        if (window.localStorage.getItem('ageguessr-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
