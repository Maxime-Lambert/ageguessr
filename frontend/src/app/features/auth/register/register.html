<main>
  <app-page width="narrow">
    <h1 class="font-display text-[32px] leading-tight sm:text-[36px]" i18n="@@register.title">
      Create your account
    </h1>
    <p class="text-muted mt-2 leading-relaxed" i18n="@@register.intro">
      Track your streak and compare scores with friends.
    </p>

    <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <app-field controlId="email" label="Email" i18n-label="@@common.email">
        <input appInput type="email" formControlName="email" autocomplete="email" />
      </app-field>

      <app-field
        controlId="username"
        label="Username"
        i18n-label="@@common.username"
        [hint]="usernameError() ? null : usernameHint"
        [error]="usernameError()"
      >
        <input
          appInput
          type="text"
          formControlName="username"
          autocomplete="username"
          (input)="usernameTaken.set(false)"
        />
      </app-field>

      <app-field
        controlId="password"
        label="Password"
        i18n-label="@@common.password"
        [hint]="passwordError() ? null : passwordHint"
        [error]="passwordError()"
      >
        <input
          appInput
          type="password"
          formControlName="password"
          autocomplete="new-password"
          (input)="passwordRefusal.set(null)"
        />
      </app-field>

      <app-field
        controlId="confirmPassword"
        label="Confirm password"
        i18n-label="@@register.confirmPassword"
      >
        <input
          appInput
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
      </app-field>

      <div>
        <div class="flex items-start gap-3">
          <input
            id="acceptTerms"
            type="checkbox"
            formControlName="acceptTerms"
            [attr.aria-describedby]="termsMissing() ? 'accept-terms-error' : null"
            [attr.aria-invalid]="termsMissing() ? 'true' : null"
            class="accent-accent mt-0.5 size-4.5 shrink-0"
          />
          <!-- New tab: following a link must not lose what was typed in the form. -->
          <label for="acceptTerms" class="text-sm leading-relaxed" i18n="@@register.acceptTerms">
            I'm at least 13 and I accept the
            <a
              routerLink="/terms"
              target="_blank"
              rel="noopener"
              class="text-accent underline underline-offset-2"
              >Terms</a
            >
            and the
            <a
              routerLink="/privacy"
              target="_blank"
              rel="noopener"
              class="text-accent underline underline-offset-2"
              >Privacy Policy</a
            >.
          </label>
        </div>
        @if (termsMissing()) {
          <p
            id="accept-terms-error"
            class="text-danger mt-1.5 text-[13px]"
            i18n="@@register.termsRequired"
          >
            You need to accept the Terms to create an account.
          </p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-danger text-sm" role="alert">{{ errorMessage() }}</p>
      }

      <button appButton block type="submit" [disabled]="submitting()" i18n="@@register.submit">
        Create account
      </button>
    </form>

    <p class="text-muted mt-6 text-center text-sm" i18n="@@register.haveAccount">
      Already have an account?
      <a routerLink="/login" class="text-accent underline underline-offset-2">Log in</a>
    </p>
  </app-page>
</main>
