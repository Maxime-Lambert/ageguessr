<main>
  <app-page width="narrow">
    <h1 class="font-display text-[32px] leading-tight sm:text-[36px]" i18n="@@login.title">
      Welcome back
    </h1>

    <form class="mt-8 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <app-field controlId="email" label="Email" i18n-label="@@common.email">
        <input appInput type="email" formControlName="email" autocomplete="email" />
      </app-field>

      <div>
        <app-field controlId="password" label="Password" i18n-label="@@common.password">
          <input
            appInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </app-field>
        <p class="mt-2 text-right text-sm">
          <a
            routerLink="/forgot-password"
            class="text-accent underline underline-offset-2"
            i18n="@@login.forgot"
            >Forgot password?</a
          >
        </p>
      </div>

      @if (errorMessage()) {
        <p class="text-danger text-sm" role="alert">{{ errorMessage() }}</p>
      }

      @if (needsVerification()) {
        <div class="card p-4 text-sm">
          <p i18n="@@login.verify">Please verify your email before logging in.</p>
          @if (resendSent()) {
            <p class="text-muted mt-1" role="status" i18n="@@login.resent">
              Verification email sent — check your inbox.
            </p>
          } @else {
            <button
              type="button"
              (click)="resendVerification()"
              class="text-accent mt-1 underline underline-offset-2"
              i18n="@@login.resend"
            >
              Resend verification email
            </button>
          }
        </div>
      }

      <button appButton block type="submit" [disabled]="submitting()" i18n="@@login.submit">
        Log in
      </button>
    </form>

    <p class="text-muted mt-6 text-center text-sm" i18n="@@login.noAccount">
      No account yet?
      <a routerLink="/register" class="text-accent underline underline-offset-2">Create one</a>
    </p>
  </app-page>
</main>
