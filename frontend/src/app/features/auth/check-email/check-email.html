<div class="mx-auto max-w-md px-6 py-16 text-center">
  <div class="bg-surface border-border rounded-lg border p-6">
    <h1 class="font-display text-3xl">Check your email</h1>
    <p class="text-muted mt-2">
      We sent a confirmation link
      @if (email) {
        to <span class="text-foreground">{{ email }}</span>
      } @else {
        to your inbox
      }
      . Click it to activate your account.
    </p>

    @if (resendSent()) {
      <p class="text-muted mt-4 text-sm">Verification email sent again — check your inbox.</p>
    } @else {
      <button type="button" (click)="resend()" class="text-accent mt-4 text-sm underline">
        Didn't get it? Resend the email
      </button>
    }
  </div>
</div>
