<div class="mx-auto max-w-md px-6 py-16 text-center">
  <div class="bg-surface border-border rounded-lg border p-6">
    <h1 class="font-display text-3xl" i18n="@@checkEmail.title">Check your email</h1>
    <p class="text-muted mt-2">
      @if (email) {
        <ng-container i18n="@@checkEmail.sentTo"
          >We sent a confirmation link to <span class="text-foreground">{{ email }}</span
          >. Click it to activate your account.</ng-container
        >
      } @else {
        <ng-container i18n="@@checkEmail.sent"
          >We sent a confirmation link to your inbox. Click it to activate your
          account.</ng-container
        >
      }
    </p>

    @if (resendSent()) {
      <p class="text-muted mt-4 text-sm" i18n="@@checkEmail.resent">
        Verification email sent again — check your inbox.
      </p>
    } @else {
      <button
        type="button"
        (click)="resend()"
        class="text-accent mt-4 text-sm underline"
        i18n="@@checkEmail.resend"
      >
        Didn't get it? Resend the email
      </button>
    }
  </div>
</div>
