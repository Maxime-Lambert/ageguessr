<div class="mx-auto max-w-md px-6 py-16 text-center">
  <div class="bg-surface border-border rounded-lg border p-6">
    @switch (status()) {
      @case ('loading') {
        <p class="text-muted">Confirming your email…</p>
      }
      @case ('success') {
        <h1 class="font-display text-3xl">Email confirmed</h1>
        <p class="text-muted mt-2">Your account is ready.</p>
        <a
          routerLink="/login"
          class="bg-accent text-accent-foreground mt-4 inline-block rounded-md px-4 py-2"
        >
          Log in
        </a>
      }
      @case ('error') {
        <h1 class="font-display text-3xl">Link invalid or expired</h1>
        <p class="text-danger mt-2">This confirmation link no longer works.</p>
        <a routerLink="/login" class="text-accent mt-4 inline-block underline">Back to login</a>
      }
    }
  </div>
</div>
