<main>
  <app-page width="narrow">
    @switch (status()) {
      @case ('loading') {
        <p class="text-muted" role="status" i18n="@@confirmEmail.loading">Confirming your email…</p>
      }
      @case ('success') {
        <h1
          class="font-display text-[32px] leading-tight sm:text-[36px]"
          i18n="@@confirmEmail.title"
        >
          Email confirmed
        </h1>
        <p class="text-muted mt-3" i18n="@@confirmEmail.ready">Your account is ready.</p>
        <a appButton routerLink="/login" class="mt-6" i18n="@@confirmEmail.login">Log in</a>
      }
      @case ('error') {
        <h1
          class="font-display text-[32px] leading-tight sm:text-[36px]"
          i18n="@@common.linkInvalid"
        >
          Link invalid or expired
        </h1>
        <p class="text-danger mt-3" i18n="@@confirmEmail.invalid">
          This confirmation link no longer works.
        </p>
        <a
          appButton
          variant="secondary"
          routerLink="/login"
          class="mt-6"
          i18n="@@common.backToLogin"
          >Back to login</a
        >
      }
    }
  </app-page>
</main>
