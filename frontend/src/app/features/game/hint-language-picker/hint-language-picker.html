<div role="group" aria-labelledby="hint-language-label" class="flex items-center gap-2 text-sm">
  <span id="hint-language-label" class="text-muted">{{ text.hintLanguage }}</span>
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.lang]="option.lang"
      [attr.aria-pressed]="language.value() === option.value"
      class="border-input-border rounded-md border px-2 py-1"
      [class.bg-accent]="language.value() === option.value"
      [class.text-accent-foreground]="language.value() === option.value"
      (click)="language.set(option.value)"
    >
      {{ option.name }}
    </button>
  }
</div>
