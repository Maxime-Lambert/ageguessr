@if (round().step === 'FINISHED') {
  <app-round-result
    [round]="round()"
    [total]="total()"
    [last]="last()"
    [reporter]="reporter()"
    (next)="next.emit()"
  />
} @else {
  <app-round
    [round]="round()"
    [total]="total()"
    [busy]="busy()"
    [error]="error()"
    (guessed)="guessed($event)"
    (hintsPicked)="hintsPicked.emit($event)"
    (imageFailed)="imageError.emit()"
  />
  @if (imageFailed()) {
    <p class="text-danger mt-4 text-sm" role="alert">{{ text.imageFailed }}</p>
    <button
      appButton
      variant="secondary"
      size="sm"
      type="button"
      class="mt-2"
      (click)="retry.emit()"
    >
      {{ text.retry }}
    </button>
  }
}
