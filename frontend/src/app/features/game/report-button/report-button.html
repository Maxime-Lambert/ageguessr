@if (done()) {
  <p class="text-xs" [class]="tones().muted" role="status">{{ text.reportSent }}</p>
} @else {
  <button
    type="button"
    class="inline-flex items-center gap-1.5 text-[13px] font-medium"
    [class]="tones().trigger"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="name()"
    (click)="toggle()"
  >
    <svg lucideFlag [size]="14" aria-hidden="true"></svg>{{ label() }}
  </button>
  @if (open()) {
    <form [id]="name()" class="mt-3 text-sm" (submit)="$event.preventDefault(); send()">
      <fieldset>
        <legend class="text-xs font-bold tracking-[0.08em] uppercase" [class]="tones().muted">
          {{ text.reportWhy }}
        </legend>
        <div class="mt-2 grid gap-1.5">
          @for (reason of reasons(); track reason.code) {
            <label class="flex items-center gap-2.5">
              <input
                type="radio"
                class="accent-accent size-4"
                [name]="name()"
                [value]="reason.code"
                [checked]="picked() === reason.code"
                (change)="pick(reason.code)"
              />
              {{ reason.label }}
            </label>
          }
        </div>
      </fieldset>
      @if (error(); as error) {
        <p class="text-danger mt-2 text-xs" role="alert">{{ error }}</p>
      }
      <div class="mt-3 flex gap-2">
        <button
          appButton
          [variant]="tones().send"
          size="sm"
          type="submit"
          [disabled]="!picked() || sending()"
        >
          {{ text.reportSend }}
        </button>
        <button
          appButton
          [variant]="tones().cancel"
          size="sm"
          type="button"
          (click)="toggle()"
        >
          {{ text.reportCancel }}
        </button>
      </div>
    </form>
  }
}
