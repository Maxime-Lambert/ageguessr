<footer class="border-border text-muted border-t px-4 py-6 text-sm sm:px-6">
  <!-- flex-wrap: on a phone the links wrap onto a second line instead of overflowing. -->
  <nav class="flex flex-wrap items-center gap-x-4 gap-y-2" aria-label="Legal">
    <a routerLink="/legal-notice" class="hover:text-foreground">Legal notice</a>
    <a routerLink="/terms" class="hover:text-foreground">Terms</a>
    <a routerLink="/privacy" class="hover:text-foreground">Privacy</a>
    <a [href]="'mailto:' + contactEmail" class="hover:text-foreground">{{ contactEmail }}</a>
  </nav>
</footer>
