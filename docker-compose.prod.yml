name: ageguessr-prod

# Logs Docker bornes par conteneur : 3 fichiers de 10 Mo, puis les plus anciens sont
# ecrases (sans max-size, json-file garde tout, jusqu'a remplir le disque). Ici et pas
# dans /etc/docker/daemon.json : le VPS est partage avec un autre projet.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  gateway:
    external: true

services:
  postgres:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ageguessr
      POSTGRES_USER: ageguessr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Volontairement le dossier parent et pas .../data : depuis Postgres 18, l'image
      # officielle met PGDATA dans /var/lib/postgresql/18/docker et declare son VOLUME
      # sur /var/lib/postgresql (permet les montees de version majeure via pg_upgrade).
      - postgres_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ageguessr -d ageguessr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Images buildees par le CI (job publish-images) et poussees sur GHCR : le VPS ne
  # fait que les telecharger. Builder sur le VPS faisait tuer ng build faute de memoire
  # (~4 Go au pic) sur une machine partagee avec un autre projet en prod.
  # IMAGE_TAG = SHA du commit deploye, ecrit dans .env par le job deploy.
  backend:
    logging: *logging
    image: ghcr.io/maxime-lambert/ageguessr-api:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ageguessr
      DB_USER: ageguessr
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGIN: "https://${DOMAIN}"
      FRONTEND_URL: "https://${DOMAIN}"
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Destinataire des alertes de signalement (vide : un log a la place).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}

  edge:
    logging: *logging
    image: ghcr.io/maxime-lambert/ageguessr-edge:${IMAGE_TAG:?IMAGE_TAG manquant}
    restart: unless-stopped
    depends_on:
      - backend
    # "default" = le reseau implicite du projet, pour joindre "backend" ;
    # "gateway" = le reseau partage avec la passerelle Caddy du VPS.
    networks:
      - default
      - gateway

  # Sauvegarde quotidienne de la base (deploy/backup/pg-backup.sh, copie sur le VPS par le
  # job deploy) : 03:00 UTC, 7 quotidiens + hebdomadaires jusqu'a 30 jours, dans
  # /opt/ageguessr/backups (disque du VPS seulement, voir docs/decisions/architecture.md,
  # « Sauvegardes et logs »). Meme image que la base : pg_dump de la meme version majeure.
  backup:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/backup/pg-backup.sh", "loop"]
    # Rien a ecrire hors de /backups (bind mount) : systeme de fichiers en lecture seule.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PGHOST: postgres
      PGUSER: ageguessr
      PGDATABASE: ageguessr
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    # "unhealthy" dans docker ps quand le dernier dump quotidien a plus de 26 h.
    healthcheck:
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 15m
      timeout: 10s
      start_period: 10m

volumes:
  postgres_data_prod:
  redis_data_prod:
